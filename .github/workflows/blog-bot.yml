# GitHub Actions workflow to run the Automated Blog Generator
name: Auto Blog Publisher

on:
  schedule:
    # Run every day at 09:00 UTC.
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write

concurrency:
  group: blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate OpenRouter API configuration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY secret is missing or empty."
            exit 1
          fi

          echo "Checking OpenRouter authentication..."
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/models > /dev/null

          echo "OpenRouter authentication check passed."

      - name: Run Blog Generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html feed.xml sitemap.xml

          if git diff --cached --quiet; then
            echo "No blog changes to commit."
            exit 0
          fi

          git commit -m "Auto-published a new blog post [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
