name: Daily editorial publisher

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: START
        run: echo "START $(date -u +%FT%TZ)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate production configuration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "ERROR STAGE=CONFIG ERROR TYPE=missing_secret ERROR MESSAGE=OPENROUTER_API_KEY is missing"; exit 1; }
          test -n "$NEWS_API_KEY" || { echo "ERROR STAGE=CONFIG ERROR TYPE=missing_secret ERROR MESSAGE=NEWS_API_KEY is missing"; exit 1; }
          echo "MODEL ${OPENROUTER_MODEL:-openrouter/auto}"

      - name: Verify API access
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python generate.py --check-api

      - name: FETCH SOURCES / GENERATE / RENDER
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python generate.py

      - name: VALIDATE HTML / RSS / SITEMAP
        run: python scripts/validate_site.py

      - name: VERIFY WORKTREE
        run: |
          git status --short
          git diff --check

      - name: COMMIT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html archive.html topics.html feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "ERROR STAGE=COMMIT ERROR TYPE=no_changes ERROR MESSAGE=generator produced no publishable changes"
            exit 1
          fi
          git commit -m "Auto-publish Carbone Notes edition [skip ci]"

      - name: PUSH
        run: |
          git pull --rebase origin main
          git push origin HEAD:main

      - name: END
        run: echo "END $(date -u +%FT%TZ)"
